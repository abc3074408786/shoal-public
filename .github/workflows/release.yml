name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: velella-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: velella-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: velella-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: velella-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="velella-${GITHUB_REF_NAME#v}-${{ matrix.archive }}"
          mkdir "$dir"
          if [[ "${{ matrix.os }}" == windows* ]]; then
            cp "target/${{ matrix.target }}/release/velella.exe" "$dir/"
          else
            cp "target/${{ matrix.target }}/release/velella" "$dir/"
          fi
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ env.ASSET }}

  github_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
