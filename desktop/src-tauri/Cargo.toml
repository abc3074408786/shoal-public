[package]
name = "velella-desktop"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
png = "0.17"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
serde_json = "1"
interprocess = "=2.4.5"
velella = { path = "../../crates/velella" }

[profile.dev]
debug = 0

[dev-dependencies]
arboard = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
codegen-units = 8
