<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velella</title>
<style>
  :root { --bg:#111318; --panel:#181b22; --line:#262a33; --fg:#d6dae2; --dim:#7d8590;
          --green:#3fb950; --yellow:#d29922; --red:#f85149; --cyan:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 ui-monospace,Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--red); }
  header .dot.ok { background:var(--green); }
  header .ver { color:var(--dim); }
  main { display:grid; grid-template-columns: 1.1fr 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px;
            padding:10px 12px; min-height:120px; }
  section h2 { font-size:12px; margin:0 0 8px; color:var(--dim); font-weight:normal;
               text-transform:uppercase; letter-spacing:.08em; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; color:var(--dim); font-weight:normal; font-size:12px;
       border-bottom:1px solid var(--line); padding:4px 6px; }
  td { padding:4px 6px; border-bottom:1px solid #1d2027; }
  tr.sel td { background:#20242d; cursor:pointer; }
  .st { font-weight:bold; }
  .st.running{color:var(--cyan)} .st.waiting_permission,.st.waiting_input,
  .st.escalated,.st.verifying{color:var(--yellow)} .st.failed{color:var(--red)}
  .st.done,.st.in_review,.st.merged{color:var(--green)}
  .st.queued,.st.stopped{color:var(--dim)}
  a { color:var(--cyan); text-decoration:none; }
  button { background:#21262f; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:3px 10px; cursor:pointer; font:inherit; font-size:12px; }
  button:hover { border-color:var(--cyan); }
  button.danger:hover { border-color:var(--red); color:var(--red); }
  #out { background:#0c0e12; border:1px solid var(--line); border-radius:8px;
         height:46vh; overflow:auto; padding:10px 12px; white-space:pre-wrap;
         word-break:break-word; font-size:12px; color:#9aa3af; }
  #events { font-size:12px; color:var(--dim); max-height:30vh; overflow:auto; }
  #err { color:var(--red); padding:6px 16px; min-height:1.2em; }
  .row { display:flex; gap:8px; margin:6px 0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><h1>velella</h1>
  <span class="ver" id="ver"></span>
  <span class="ver">— a colony of agents, sailing while you sleep</span>
</header>
<div id="err"></div>
<main>
  <section>
    <h2>tasks</h2>
    <table><thead><tr><th>name</th><th>state</th><th>agent</th><th></th></tr></thead>
      <tbody id="tasks"></tbody></table>
  </section>
  <section>
    <h2>sessions</h2>
    <table><thead><tr><th>id</th><th>state</th><th>program</th><th></th></tr></thead>
      <tbody id="sessions"></tbody></table>
  </section>
  <section>
    <h2>output — <span id="watch">-</span></h2>
    <div id="out">click a session to follow its stream…</div>
  </section>
  <section>
    <h2>audit log — <span id="taskname">-</span></h2>
    <div id="events">click a task…</div>
    <div class="row" id="taskactions" style="display:none">
      <button onclick="verifyTask()">re-verify</button>
      <button onclick="prTask()">open PR</button>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let TOKEN = params.get("token") || localStorage.getItem("velella_token") || "";
if (TOKEN) localStorage.setItem("velella_token", TOKEN);

const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
async function api(path, opts = {}) {
  const h = Object.assign({"Content-Type":"application/json"}, TOKEN ? {"Authorization":"Bearer "+TOKEN} : {});
  const r = await fetch(path, Object.assign({headers: h}, opts));
  if (r.status === 401) {
    TOKEN = prompt("This daemon requires http_token — paste it:"); localStorage.setItem("velella_token", TOKEN||"");
    throw new Error("unauthorized — retrying with new token");
  }
  return r.json();
}

let watch = null, since = 0, selTask = null, selSess = null;

async function poll() {
  try {
    const st = await api("/status");
    $("dot").classList.add("ok");
    $("ver").textContent = "v" + st.version;
    $("err").textContent = "";
    const tasks = (await api("/tasks")).tasks || [];
    $("tasks").innerHTML = tasks.map(t =>
      `<tr class="${selTask===t.name?'sel':''}" onclick="pickTask('${t.name}')">
        <td>${esc(t.name)}</td><td class="st ${t.state}">${t.state}</td>
        <td>${esc(t.agent)}</td>
        <td>${t.pr_url ? `<a href="${t.pr_url}" target="_blank">PR</a>` : ""}</td></tr>`).join("")
      || "<tr><td colspan=4 style='color:var(--dim)'>no tasks — queue one with the CLI</td></tr>";
    const sessions = (await api("/sessions")).sessions || [];
    $("sessions").innerHTML = sessions.map(s =>
      `<tr class="${selSess===s.id?'sel':''}" onclick="pickSession('${s.id}')">
        <td>${s.id.split("-")[0]}</td><td class="st ${s.state}">${s.state}</td>
        <td>${esc(s.program)}</td>
        <td><button onclick="event.stopPropagation();approve('${s.id}')">approve</button>
            <button class="danger" onclick="event.stopPropagation();kill('${s.id}')">kill</button></td></tr>`).join("")
      || "<tr><td colspan=4 style='color:var(--dim)'>no sessions</td></tr>";
    if (watch) {
      const r = await api(`/sessions/${watch}/output?since=${since}`);
      if ((r.from||0) > since) $("out").textContent += "\n[older output truncated]";
      $("out").textContent += r.data || "";
      if ($("out").textContent.length > 128000) $("out").textContent = $("out").textContent.slice(-96000);
      since = r.end || since;
      $("out").scrollTop = $("out").scrollHeight;
    }
    if (selTask) {
      const ev = (await api(`/tasks/${selTask}/events`)).events || [];
      $("events").innerHTML = ev.map(e =>
        `#${e.seq} ${String(e.kind).replaceAll('"','')} ${esc(JSON.stringify(e.payload))}`).join("<br>")
        || "no events yet";
      $("taskactions").style.display = "flex";
    }
  } catch (e) { $("err").textContent = "daemon unreachable: " + e.message; $("dot").classList.remove("ok"); }
}
function pickSession(id) {
  selSess = id; watch = id; since = 0; $("out").textContent = ""; $("watch").textContent = id.split("-")[0]; poll();
}
function pickTask(name) { selTask = name; $("taskname").textContent = name; $("taskactions").style.display="flex"; poll(); }
async function approve(id) { await api(`/sessions/${id}/approve`, {method:"POST", body: JSON.stringify({answer:"1"})}); poll(); }
async function kill(id) { if (!confirm("kill session?")) return; await api(`/sessions/${id}/kill`, {method:"POST"}); poll(); }
async function verifyTask() { const r = await api(`/tasks/${selTask}/verify`, {method:"POST"}); $("status")?.append; poll(); }
async function prTask() { const r = await api(`/tasks/${selTask}/pr`, {method:"POST"}); poll(); }

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
