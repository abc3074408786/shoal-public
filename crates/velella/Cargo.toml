[package]
name = "velella"
default-run = "velella"
description = "A colony of agents, sailing while you sleep: the agent task runtime CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "velella"
path = "src/main.rs"

[[bin]]
name = "velella-runtime"
path = "src/runtime_main.rs"

[[bin]]
name = "velella-cli"
path = "src/desktop_cli_main.rs"

[dependencies]
velella-core = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
toml_edit = "0.22.27"
chrono = { workspace = true }
ratatui = { workspace = true }
portable-pty = { workspace = true }
interprocess = "2.4"
base64 = "0.22"
vt100 = "0.15"
fs2 = "0.4"
sha2 = "0.10"
widestring = "1.2"
dunce = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { workspace = true }
rusqlite = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
